name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install sandbox test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          bwrap --version

      - name: Install dependencies
        run: npm ci

      - name: Static and type checks
        run: npm run check

      - name: Unit and isolated integration tests
        run: npm test

      - name: Build and validate UI assets
        run: npm run build
