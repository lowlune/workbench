<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f3f3">
    <title>Workbench</title>
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/fonts/inter.css?v=2">
    <link rel="stylesheet" href="/login.css">
    <script src="/login.js" defer></script>
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card" aria-labelledby="login-title">
        <h1 id="login-title">Welcome back</h1>
        <form action="/auth/login" method="post">
          <label class="visually-hidden" for="password">Access key</label>
          <input id="password" name="password" type="password" inputmode="text" autocapitalize="off" autocomplete="current-password" autocorrect="off" spellcheck="false" placeholder="Access key" aria-describedby="login-error" required autofocus>
          <p id="login-error" class="login-error" role="alert" hidden></p>
          <button type="submit">Open workspace</button>
        </form>
      </section>
    </main>
  </body>
</html>
